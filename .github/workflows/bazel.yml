name: bazel

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:

  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
    - run: bazelisk test --config=ci ...
      working-directory: test
      env:
        USE_BAZEL_VERSION: 6.x

  # A release archive is required for bzlmod
  # See: https://blog.bazel.build/2023/02/15/github-archive-checksum.html
  release-archive:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      contents: write

    steps:
      - uses: actions/setup-go@v5
      - run: go install github.com/bazelbuild/buildtools/buildozer@latest
      - uses: actions/checkout@v4
      - run: ./scripts/sync_bzlmod_version.sh
      - run: git archive "$GITHUB_REF" -o "entt-${GITHUB_REF_NAME}.tar.gz"
      - run: gh release upload "${GITHUB_REF_NAME}" "entt-${GITHUB_REF_NAME}.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}
