name: coverage

on: [push, pull_request]

jobs:

  codecov:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Compile tests
      working-directory: build
      env:
        CXXFLAGS: "--coverage -fno-elide-constructors -fno-inline -fno-default-inline"
        CXX: g++
      run: |
        cmake -DENTT_BUILD_TESTING=ON -DENTT_BUILD_LIB=ON -DENTT_BUILD_EXAMPLE=ON ..
        make -j4
    - name: Run tests
      working-directory: build
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
      run: ctest -C Debug -j4
    - name: Collect data
      working-directory: build
      run: |
        sudo apt update
        sudo apt install -y lcov
        IGNORE="gcov,gcov,mismatch,mismatch,inconsistent,inconsistent,negative,negative"
        lcov -c -d . -o coverage.info --rc geninfo_unexecuted_blocks=1 --ignore-errors "$IGNORE"
        lcov -r coverage.info '/usr/*' '*/test/*' '*/build/*' -o coverage.info --ignore-errors "$IGNORE,unused,unused"
        lcov -l coverage.info --ignore-errors "$IGNORE"
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: build/coverage.info
        name: EnTT
        fail_ci_if_error: true
